name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Where CI keeps the Native SDK framework checkout; the build
  # override below points the app at it.
  NATIVE_SDK_PATH: "../native-sdk"

jobs:
  test:
    name: Logic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - name: Fetch native-sdk
        run: |
          if [ ! -f "$NATIVE_SDK_PATH/build.zig" ]; then
            git clone --depth 1 https://github.com/vercel-labs/native.git "$NATIVE_SDK_PATH"
          fi
      - name: SDK patches must apply cleanly
        run: |
          # Regression guard for the dsh-local native-sdk patches
          # (menu-bar merge, App-Nap disable): an SDK upgrade that shifts
          # patch context must fail HERE, loudly — never silently ship an
          # unpatched host that suspends the web content.
          bash scripts/apply-native-sdk-patches.sh
      - run: zig build test -Dplatform=null -Dnative-sdk-path="$NATIVE_SDK_PATH"
